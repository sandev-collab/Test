plugins {
    id 'com.android.application'
}

android {
    namespace 'com.test.randomapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.test.randomapp'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "missing.jks")
            storePassword "testpass123"
            keyAlias "test"
            keyPassword "testpass123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}